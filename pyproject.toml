[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "duplicate-finder"
dynamic = ["version"]
description = "Find duplicate files and safely remove extra copies after user approval."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
trash = ["send2trash>=1.8"]
dev = ["pytest>=7"]

[project.gui-scripts]
duplicate-finder = "duplicate_finder.gui:main"

[tool.setuptools]
packages = ["duplicate_finder"]

[tool.setuptools.dynamic]
version = { attr = "duplicate_finder.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
